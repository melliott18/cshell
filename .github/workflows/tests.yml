name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }}, ${{ matrix.cc }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
          - os: macos-15
            cc: clang
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex
      - name: Install macOS scanner
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install flex
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Build
        run: make -j2
      - name: Test input/lexer/parser/alias/state/expansion/execution APIs and selected behavior
        run: make test
      - name: Test terminal startup and exit
        run: make test-pty
      - name: Test harness failure handling
        run: make test-harness
      - name: Check lexer, parser, alias, state, expansion, and execution ownership with ASan and UBSan
        env:
          ASAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          make clean
          make test-lexer test-parser test-alias test-state test-expand test-execute CFLAGS='-std=c99 -Wall -Wextra -Wpedantic -Wshadow -Werror -g -O1 -fsanitize=address,undefined -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address,undefined'

  docker:
    name: Docker (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Build Linux image and test input/lexer/parser/alias/state/expansion/execution APIs and selected behavior
        run: make docker-test
      - name: Test terminal startup and exit in Linux image
        run: make docker-test-pty
      - name: Test harness failure handling in Linux image
        run: docker run --rm --init cshell-test:local make test-harness
