name: Filesystem qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  filesystem:
    name: Filesystem (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Supply Linux providers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential ed busybox file pax
      - name: Supply macOS predicate providers
        if: runner.os == 'macOS'
        run: brew list coreutils >/dev/null 2>&1 || brew install coreutils
      - name: Build selected profile and verify the harness
        run: make -j2 cshell host-profile test-host-inventory
      - name: Qualify the declared filesystem subset
        run: |
          mkdir -p build/tests
          python3 tests/host_filesystem.py ./cshell --audit \
            --path "$PWD/build/host-profile/bin:$(getconf PATH)" \
            --record build/tests/filesystem-selected.json 2>&1 | tee build/tests/filesystem-selected.log
      - name: Audit unqualified vendor contracts (strict diagnostic run)
        continue-on-error: true
        run: |
          python3 tests/host_filesystem.py ./cshell --extended-only --provider-audit \
            --path "$PWD/build/host-profile/bin:$(getconf PATH)" \
            --record build/tests/filesystem-provider-audit.json 2>&1 | tee build/tests/filesystem-provider-audit.log
      - name: Retain identities, expectations, effects and strict failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filesystem-${{ matrix.os }}
          path: |
            build/tests/filesystem-*.json
            build/tests/filesystem-*.log
            build/host-profile/manifest.json
